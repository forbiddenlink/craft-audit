name: Nightly Full Audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      project_path:
        description: 'Craft project root path'
        required: false
        default: '.'
      production_url:
        description: 'Production URL for visual checks (optional)'
        required: false
        default: ''
      staging_url:
        description: 'Staging URL for visual checks (optional)'
        required: false
        default: ''

jobs:
  full-audit:
    permissions:
      contents: read
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Resolve audit settings
        id: cfg
        env:
          # Pass untrusted workflow_dispatch inputs via env, not direct template
          # expansion, so a crafted value can't inject shell (zizmor template-injection).
          IN_PROJECT_PATH: ${{ github.event.inputs.project_path }}
          IN_PRODUCTION_URL: ${{ github.event.inputs.production_url }}
          IN_STAGING_URL: ${{ github.event.inputs.staging_url }}
        run: |
          project_path="$IN_PROJECT_PATH"
          if [ -z "$project_path" ]; then project_path="."; fi

          prod="$IN_PRODUCTION_URL"
          stage="$IN_STAGING_URL"
          visual="false"
          if [ -n "$prod" ] && [ -n "$stage" ]; then visual="true"; fi

          {
            echo "project_path=$project_path"
            echo "visual=$visual"
            echo "production_url=$prod"
            echo "staging_url=$stage"
          } >> "$GITHUB_OUTPUT"

      - name: Run full audit (no visual)
        if: steps.cfg.outputs.visual == 'false'
        env:
          PROJECT_PATH: ${{ steps.cfg.outputs.project_path }}
        run: |
          # Default to test-craft-project when no path specified
          path="$PROJECT_PATH"
          threshold="high"
          if [ "$path" = "." ]; then
            path="test-craft-project"
            threshold="none"  # Test project has intentional issues
          fi
          node dist/cli.js audit "$path" \
            --output sarif \
            --output-file craft-audit-nightly.sarif \
            --exit-threshold "$threshold"

      - name: Run full audit (with visual)
        if: steps.cfg.outputs.visual == 'true'
        env:
          PROJECT_PATH: ${{ steps.cfg.outputs.project_path }}
          PRODUCTION_URL: ${{ steps.cfg.outputs.production_url }}
          STAGING_URL: ${{ steps.cfg.outputs.staging_url }}
        run: |
          # Default to test-craft-project when no path specified
          path="$PROJECT_PATH"
          threshold="high"
          if [ "$path" = "." ]; then
            path="test-craft-project"
            threshold="none"  # Test project has intentional issues
          fi
          node dist/cli.js audit "$path" \
            --production "$PRODUCTION_URL" \
            --staging "$STAGING_URL" \
            --output sarif \
            --output-file craft-audit-nightly.sarif \
            --exit-threshold "$threshold"

      - name: Upload nightly SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: craft-audit-nightly.sarif
          category: craft-audit-nightly
