packages:
  - "."

allowBuilds:
  msw: true
  puppeteer: true
  sharp: true
# Pin transitive deps: minimatch for CVE-2024-XXXXX, lodash for CVE-2026-4800/CVE-2026-2950 (both via backstopjs)
overrides:
  basic-ftp: ">=5.3.1"
  next: ">=16.2.11"
  picomatch: ">=4.0.4"
  rollup: ">=4.59.0"
  lodash: ">=4.18.1"
  fast-uri: ">=3.1.2"
  uuid: ">=11.1.1"
  body-parser: ">=1.20.6 <2"
  ip-address: ">=10.3.1 <11"
  js-yaml: ">=4.3.1 <5"
  postcss: ">=8.5.23 <9"
  sharp: ">=0.35.0 <1"
  vite: ">=8.0.16 <9"
  puppeteer: "25.9.0"
  puppeteer-core: "25.9.0"
  "@puppeteer/browsers": "3.2.1"
