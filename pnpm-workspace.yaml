  next: "16.3.4"
  picomatch: ">=4.0.4 <5"
  rollup: ">=4.59.0 <5"
  lodash: ">=4.18.1 <5"
  fast-uri: ">=3.1.2 <4"
  uuid: ">=11.1.1 <12"
  body-parser: ">=1.20.6 <2"
  ip-address: ">=10.3.1 <11"
  js-yaml: ">=4.3.1 <5"
  postcss: ">=8.5.23 <9"
  sharp: ">=0.35.0 <1"
  vite: ">=8.0.16 <9"
  puppeteer: "25.9.0"
  puppeteer-core: "25.9.0"
  "@puppeteer/browsers": "3.2.2"
